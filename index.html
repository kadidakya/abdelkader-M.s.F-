<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أداة M.S.F لتحميل الفيديوهات</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h2 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      font-size: 14px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    input[type="text"] {
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    input[type="text"]:focus {
      border-color: #e62e04;
    }
    .btn-action {
      background-color: #e62e04;
      color: #fff;
      padding: 12px 20px;
      border: none;
      font-weight: bold;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
    }
    .btn-action:hover {
      background-color: #cc2900;
    }
    .btn-termux {
      background-color: #1e1e1e;
      color: #00ff00;
      font-family: monospace;
    }
    .btn-termux:hover {
      background-color: #333;
    }
    .result {
      margin-top: 20px;
      word-break: break-all;
    }
    .footer {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>أداة M.S.F لتحميل الفيديوهات</h2>
    <p>ضع رابط الفيديو لتنزيله أو للحصول على أمر Termux جاهز:</p>
    
    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="https://www.tiktok.com/... لصق الرابط هنا">
      <button class="btn-action" onclick="downloadDirectly()">تنزيل مباشر من الموقع</button>
      <button class="btn-action btn-termux" onclick="copyGetCommand()">نسخ أمر get لـ Termux</button>
    </div>

    <div class="result" id="resultArea"></div>
  </div>

  <div class="footer">
    <p>© جميع الحقوق محفوظة - متجر M.S.F</p>
  </div>

  <script>
    async function downloadDirectly() {
      const url = document.getElementById('videoUrl').value.trim();
      const resultArea = document.getElementById('resultArea');
      
      if(!url) {
        alert('الرجاء إدخال رابط الفيديو أولاً!');
        return;
      }

      resultArea.innerHTML = 'جاري استخراج الفيديو بدون علامة مائية...';

      try {
        const response = await fetch(`https://tikwm.com/api/?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if(data && data.code === 0 && data.data.play) {
          const downloadLink = data.data.play;
          resultArea.innerHTML = `
            <p style="color: green; font-weight: bold;">تم تجهيز الفيديو!</p>
            <a href="${downloadLink}" target="_blank" class="btn-action" style="display:inline-block; margin-top:10px;">تحميل الملف الآن</a>
          `;
        } else {
          resultArea.innerHTML = '<p style="color: red;">خطأ في جلب الفيديو، تأكد من صحة الرابط.</p>';
        }
      } catch (error) {
        resultArea.innerHTML = '<p style="color: red;">حدث خطأ في الاتصال، حاول مجدداً.</p>';
      }
    }

    function copyGetCommand() {
      const url = document.getElementById('videoUrl').value.trim();
      if(!url) {
        alert('الرجاء إدخال رابط الفيديو أولاً!');
        return;
      }
      const command = `get "${url}"`;
      navigator.clipboard.writeText(command);
      document.getElementById('resultArea').innerHTML = `
        <p style="color: #008000; font-weight: bold;">تم نسخ الأمر حافظتك!</p>
        <code style="background:#eee; padding:5px 10px; border-radius:5px; display:inline-block;">${command}</code>
        <p style="font-size:12px; color:#555;">افتح Termux والصق الأمر مباشرة ليتم التحميل.</p>
      `;
    }
  </script>

</body>
</html>
