<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 450px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2563eb;
        }
        #result {
            margin-top: 15px;
            font-size: 14px;
        }
        .download-btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            background: #22c55e;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .download-btn:hover {
            background: #16a34a;
        }
        footer {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>تحميل الفيديوهات بدون علامة مائية</h2>
        <p style="font-size: 14px; color: #cbd5e1; margin-bottom: 20px;">ضع رابط الفيديو وسيظهر لك زر التحميل فوراً</p>
        
        <input type="text" id="urlInput" placeholder="أدخل الرابط هنا...">
        <button onclick="fetchVideo()">الحصول على رابط التحميل</button>
        <div id="result"></div>
    </div>

    <footer>
        جميع الحقوق محفوظة m.s.f
    </footer>

    <script>
        async function fetchVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                alert('الرجاء إدخال رابط صحيح أولاً!');
                return;
            }
            
            resultDiv.innerHTML = '<span style="color: #38bdf8;">جاري معالجة الفيديو... ⏳</span>';
            
            try {
                const response = await fetch(`https://tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                
                if (data.code === 0 && data.data && data.data.play) {
                    const videoUrl = data.data.play;
                    resultDiv.innerHTML = `
                        <p style="color: #22c55e; margin: 10px 0 0 0;">تم استخراج الفيديو بنجاح!</p>
                        <a class="download-btn" href="${videoUrl}" target="_blank" download>تحميل الفيديو الآن 📥</a>
                    `;
                } else {
                    resultDiv.innerHTML = '<span style="color: #ef4444;">فشل في جلب الفيديو، تأكد أن الرابط صحيح.</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<span style="color: #ef4444;">حدث خطأ في الاتصال، حاول مرة أخرى.</span>';
            }
        }
    </script>

</body>
</html>
