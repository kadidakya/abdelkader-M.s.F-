<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, sans-serif;
            background: #090d16;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 420px;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid #334155;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 20px;
            color: #38bdf8;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #1d4ed8;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
        }
        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>تحميل الفيديوهات بدون علامة مائية</h2>
        <p>ألصق رابط الفيديو أدناه وسيتم تجهيز التحميل فوراً</p>
        
        <input type="text" id="urlInput" placeholder="https://...">
        <button onclick="startDownload()">الحصول على رابط التحميل</button>
        <div id="status"></div>
    </div>

    <footer>
        جميع الحقوق محفوظة m.s.f
    </footer>

    <script>
        function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const statusDiv = document.getElementById('status');
            
            if (!url) {
                alert('الرجاء إدخال الرابط أولاً!');
                return;
            }
            
            statusDiv.innerHTML = '<span style="color: #38bdf8;">جاري معالجة الرابط واستخراج الفيديو... ⏳</span>';
            
            setTimeout(() => {
                const downloadLink = 'https://ssstik.io/ar?url=' + encodeURIComponent(url);
                statusDiv.innerHTML = `
                    <p style="color: #22c55e; margin: 10px 0 5px 0; font-size:13px;">تم استخراج الفيديو بنجاح!</p>
                    <a href="${downloadLink}" target="_blank" download="video.mp4" style="display:block; margin-top:5px; color:#fff; font-weight:bold; text-decoration:none; background:#22c55e; padding:12px; border-radius:8px;">تحميل الفيديو إلى الهاتف 📥</a>
                `;
            }, 800);
        }
    </script>

</body>
</html>
