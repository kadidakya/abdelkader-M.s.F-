<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر عبد القادر - أفضل العروض والتقنيات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .header h1 {
            color: #1e293b;
            font-size: 24px;
        }
        .product-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .product-title {
            font-size: 20px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 10px;
        }
        .product-description {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .buy-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #e62e04;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border-radius: 10px;
            transition: background 0.3s ease;
            box-shadow: 0 4px 12px rgba(230, 46, 4, 0.3);
        }
        .buy-btn:hover {
            background-color: #cd2803;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>متجر M.S.F الترويجي</h1>
    </div>

    <div class="product-card">
        <!-- صورة المنتج -->
        <img src="https://ae01.alicdn.com/kf/S8f98a2b53b814a0cb8b51d4512b9d628P.jpg" alt="DataShow Projector">
        <h2 class="product-title">جهاز العرض السينمائي (DataShow Smart HD)</h2>
        <p class="product-description">استمتع بتجربة سينمائية فريدة في المنزل، شاشة عرض عالية الدقة ومناسبة لمشاهدة المباريات والأفلام بأعلى جودة.</p>
        
        <!-- استبدل عبارة رابط_الأفلييت_هنا برابطك الحقيقي لاحقاً -->
        <a href="رابط_الأفلييت_هنا" class="buy-btn" target="_blank" rel="noopener noreferrer">
            اشترِ الآن من AliExpress
        </a>
    </div>

    <div class="footer">
        <p>© جميع الحقوق محفوظة - متجر عبد القادر</p>
    </div>

</body>
</html>
