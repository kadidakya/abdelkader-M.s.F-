<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abdelkader M.s.F - المتجر التجاري</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            text-align: right;
            direction: rtl;
        }
        header {
            background-color: #1b3b2b;
            color: #d4af37;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 2.2em;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .btn {
            background-color: #1b3b2b;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #2c5e43;
        }
        .btn-fb {
            background-color: #1877f2;
        }
        .btn-fb:hover {
            background-color: #145dbf;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <h1>abdelkader M.s.F</h1>
    </header>

    <div class="container">
        <h2>قائمة المنتجات والعروض الحالية</h2>
        <div class="product">
            <h3>جهاز عرض (DataShow)</h3>
            <p>جودة عالية ودقة عرض ممتازة.</p>
            <p style="color: #a91e44; font-weight: bold; font-size: 1.2em;">25,000 دج</p>
            <button class="btn" onclick="alert('تمت الإضافة للسلة')">أضف للسلة</button>
            <a href="https://www.facebook.com/mariya.bilik.9" target="_blank" class="btn btn-fb" style="margin-top: 10px;">تواصل معنا عبر فيسبوك</a>
        </div>

        <hr style="margin: 30px 0;">

        <h2>إتمام طلب شراء أو استفسار</h2>
        <form onsubmit="event.preventDefault(); alert('تم إرسال طلبك بنجاح! سنتواصل معك قريباً.');">
            <label>الاسم واللقب:</label>
            <input type="text" placeholder="اكتب اسمك هنا..." required>
            
            <label>رقم الهاتف:</label>
            <input type="tel" placeholder="رقم الهاتف للتواصل..." required>
            
            <label>الطلب أو الاستفسار:</label>
            <textarea rows="4" placeholder="اكتب تفاصيل طلبك..."></textarea>
            
            <button type="submit" class="btn">إرسال الطلب الآن</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="https://www.facebook.com/mariya.bilik.9" target="_blank" class="btn btn-fb">أو أرسل طلبك مباشرة عبر حسابنا على فيسبوك</a>
        </div>

        <hr style="margin: 30px 0;">

        <div style="background: #fafafa; padding: 15px; border-radius: 5px; border: 1px solid #eee;">
            <h3>تسجيل دخول المالك</h3>
            <label>البريد الإلكتروني:</label>
            <input type="email" value="admin@abdelkader.com">
            
            <label>كلمة السر:</label>
            <input type="password" placeholder="********">
            
            <button class="btn">تسجيل الدخول</button>
        </div>
    </div>

</body>
</html>
