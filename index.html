<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title M.S.F لتحميل الفيديوهات</title>
<meta name="google-site-verification" content="aakEaeWHieKlphD1ueKYA81FEYdrjPbzYHBqYeZCnoA" /> 
 <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      max-width: 480px;
      width: 100%;
      text-align: center;
      z-index: 1;
    }
    h2 {
      color: #111;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
    }
    input[type="text"] {
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    input[type="text"]:focus {
      border-color: #e62e04;
    }
    .btn-action {
      background-color: #e62e04;
      color: #fff;
      padding: 12px 20px;
      border: none;
      font-weight: bold;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-action:hover {
      background-color: #cc2900;
    }
    .result {
      margin-top: 20px;
      word-break: break-all;
    }
    .footer {
      margin-top: 20px;
      font-size: 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 12px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>M.S.F لتحميل الفيديوهات</h2>
    
    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="ضع رابط (YouTube / Facebook / Instagram / TikTok) هنا">
      <button class="btn-action" onclick="downloadToPhone()">تنزيل وتخزين في الهاتف</button>
    </div>

    <div class="result" id="resultArea"></div>
  </div>

  <div class="footer">
    <p>© جميع الحقوق محفوظة - M.S.F</p>
  </div>

  <script>
    async function downloadToPhone() {
      const url = document.getElementById('videoUrl').value.trim();
      const resultArea = document.getElementById('resultArea');
      
      if(!url) {
        alert('الرجاء إدخال رابط الفيديو أولاً!');
        return;
      }

      resultArea.innerHTML = 'جاري استخراج الفيديو من المنصة...';

      try {
        let downloadLink = '';
        
        // استخدام خدمة متعددة المنصات قوية جداً تدعم فيسبوك ويوتيوب وإنستغرام وتيك توك
        const response = await fetch(`https://api.cobalt.tools/api/json`, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ 
            url: url,
            vCodec: "h264",
            vQuality: "720",
            dubLang: false
          })
        });
        
        const data = await response.json();
        
        if(data && (data.url || data.picker)) {
          downloadLink = data.url || (data.picker && data.picker[0] ? data.picker[0].url : '');
        }

        if(downloadLink) {
          resultArea.innerHTML = `
            <p style="color: green; font-weight: bold;">تم تجهيز الفيديو بنجاح!</p>
            <a href="${downloadLink}" download="video_MSF.mp4" target="_blank" class="btn-action" style="margin-top:10px;">اضغط هنا لحفظ الفيديو في الهاتف</a>
          `;
        } else {
          resultArea.innerHTML = '<p style="color: red;">خطأ في جلب الفيديو، تأكد من أن الرابط عام وليس خاصاً.</p>';
        }
      } catch (error) {
        resultArea.innerHTML = '<p style="color: red;">حدث خطأ في الاتصال، حاول مجدداً.</p>';
      }
    }
  </script>

</body>
