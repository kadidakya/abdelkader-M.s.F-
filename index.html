<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات - عبد القادر</title>
    <!-- كود إثبات ملكية جوجل Search Console -->
    <meta name="google-site-verification" content="aakEaeWHieKlphD1ueKYA81FEYdrjPbzYHBqYeZCnoA" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px 20px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .platforms {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .badge {
            background: #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            text-align: right;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #0369a1;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #0f172a;
            display: none;
        }
        .result-box a {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            background: #22c55e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3);
        }
        .result-box a:hover {
            background: #16a34a;
        }
        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>موقع عبد القادر لتحميل الفيديوهات</h1>
        <p class="subtitle">حمل الفيديوهات بجودة عالية وبدون علامة مائية مباشرة لهاتفك</p>

        <div class="platforms">
            <span class="badge">TikTok</span>
            <span class="badge">Instagram</span>
            <span class="badge">YouTube</span>
            <span class="badge">Facebook</span>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="ضع رابط الفيديو هنا (تيك توك، وغيرها)..." autocomplete="off">
            <button onclick="fetchVideo()">معالجة واستخراج الفيديو</button>
        </div>

        <div id="result" class="result-box">
            <p id="statusText">جاري جلب الفيديو بدون علامة مائية...</p>
            <div id="downloadLinkArea"></div>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة &copy; Abdelkader M.S.F</footer>

    <script>
        async function fetchVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            const resultBox = document.getElementById('result');
            const statusText = document.getElementById('statusText');
            const downloadArea = document.getElementById('downloadLinkArea');

            if (!url) {
                alert('يرجى إدخال رابط الفيديو أولاً!');
                return;
            }

            resultBox.style.display = 'block';
            statusText.innerText = 'جاري الاتصال بالسيرفر لاستخراج الفيديو...';
            downloadArea.innerHTML = '';

            try {
                // استخدام خدمة API مجانية وآمنة لجلب فيديوهات تيك توك بدون علامة مائية
                const response = await fetch(`https://tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data && data.code === 0 && data.data && data.data.play) {
                    const videoDownloadUrl = data.data.play; // رابط الفيديو بدون علامة مائية
                    statusText.innerText = 'تم تجهيز الفيديو بنجاح!';
                    
                    // إنشاء زر تحميل مباشر يجبر المتصفح على حفظه في ذاكرة الهاتف
                    downloadArea.innerHTML = `
                        <a href="${videoDownloadUrl}" download="video_abdelkader.mp4" target="_blank">
                            📥 اضغط هنا لتنزيل الفيديو في الهاتف
                        </a>
                    `;
                } else {
                    statusText.innerText = 'عذراً، لم يتم العثور على الفيديو. تأكد من صحة الرابط.';
                }
            } catch (error) {
                statusText.innerText = 'حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.';
            }
        }
    </script>

</body>
</html>
