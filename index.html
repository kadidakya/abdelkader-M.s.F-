<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 450px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2563eb;
        }
        #result {
            margin-top: 15px;
            font-size: 14px;
        }
        footer {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>تحميل الفيديوهات بدون علامة مائية</h2>
        <p style="font-size: 14px; color: #cbd5e1; margin-bottom: 20px;">ضع رابط الفيديو من أي منصة وسيبدأ التحميل فوراً</p>
        
        <input type="text" id="urlInput" placeholder="أدخل الرابط هنا...">
        <button onclick="downloadVideo()">تحميل إلى الهاتف</button>
        <div id="result"></div>
    </div>

    <footer>
        جميع الحقوق محفوظة m.s.f
    </footer>

    <script>
        function downloadVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                alert('الرجاء إدخال رابط صحيح أولاً!');
                return;
            }
            
            resultDiv.innerHTML = '<span style="color: #38bdf8;">جاري تجهيز رابط التحميل... ⏳</span>';
            
            // استخدام خدمة API سريعة ومجانية لمعالجة روابط الفيديوهات بدون علامة مائية
            setTimeout(() => {
                const encodedUrl = encodeURIComponent(url);
                // توجيه المستخدم إلى نافذة التحميل المباشر
                resultDiv.innerHTML = `<a href="https://tikwm.com/api/?url=${encodedUrl}" target="_blank" style="display:inline-اضافة; margin-top:10px; color:#22c55e; font-weight:bold; text-decoration:underline;">اضغط هنا لتحميل الفيديو بصيغة MP4 📥</a>`;
            }, 1000);
        }
    </script>

</body>
</html>
