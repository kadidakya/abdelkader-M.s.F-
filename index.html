<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>abdelkader M.s.F - المتجر التجاري المحمي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2b2b2b; line-height: 1.6;
            background-image: url('background.jpg');
            background-size: cover; background-position: center;
            background-repeat: no-repeat; background-attachment: fixed;
        }
        header {
            background-color: rgba(20, 40, 30, 0.9); color: #ffffff;
            padding: 30px 20px; text-align: center; border-bottom: 5px solid #2d6a4f;
        }
        header h1 { font-size: 2.5rem; margin-bottom: 8px; color: #e9c46a; }
        header p { font-size: 1.1rem; color: #d8f3dc; }
        nav {
            background-color: rgba(45, 106, 79, 0.92);
            display: flex; justify-content: center; gap: 15px; padding: 12px; flex-wrap: wrap;
        }
        nav a { color: #ffffff; text-decoration: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; }
        nav a:hover { background-color: #e9c46a; color: #1b4332; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .card {
            background-color: rgba(255, 255, 255, 0.94); border-radius: 8px;
            padding: 25px; margin-bottom: 25px; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            border-right: 5px solid #e9c46a;
        }
        .card h2 { color: #1b4332; margin-bottom: 15px; border-bottom: 2px solid #e9c46a; padding-bottom: 8px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-item { background: rgba(255, 255, 255, 0.95); border: 1px solid #d8f3dc; border-radius: 6px; padding: 15px; text-align: center; }
        .product-item h3 { color: #1b4332; margin-bottom: 10px; }
        .product-price { color: #b7094c; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }
        .btn {
            display: inline-block; padding: 10px 20px; background-color: #2d6a4f;
            color: white; text-decoration: none; border-radius: 5px; font-weight: bold; border: none; cursor: pointer;
        }
        .btn:hover { background-color: #1b4332; }
        .btn-danger { background-color: #b7094c; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #1b4332; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; background-color: rgba(255, 255, 255, 0.9); }
        textarea.form-control { resize: vertical; height: 90px; }
        #adminPanel { display: none; border-right: 5px solid #b7094c; background-color: rgba(255, 243, 205, 0.95); }
        footer { text-align: center; padding: 20px; background-color: rgba(20, 40, 30, 0.9); color: white; margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <h1>abdelkader M.s.F</h1>
        <p>متجرك التجاري الموثوق - بوابة الإدارة والبيع</p>
    </header>
    <nav>
        <a href="#store">المنتجات</a>
        <a href="#cart">طلب شراء</a>
        <a href="#adminSection">دخول المالك</a>
    </nav>
    <div class="container">
        <section id="store" class="card">
            <h2>قائمة المنتجات والعروض الحالية</h2>
            <div id="productsGrid" class="products-grid"></div>
        </section>
        <section id="cart" class="card">
            <h2>إتمام طلب شراء أو استفسار</h2>
            <form onsubmit="event.preventDefault(); alert('تم إرسال طلبك بنجاح! سنتواصل معك قريباً.');">
                <div class="form-group"><label>الاسم واللقب:</label><input type="text" id="clientName" class="form-control" required></div>
                <div class="form-group"><label>رقم الهاتف:</label><input type="tel" id="clientPhone" class="form-control" required></div>
                <div class="form-group"><label>تفاصيل الطلب:</label><textarea id="orderDetails" class="form-control" required></textarea></div>
                <button type="submit" class="btn">إرسال الطلب الآن</button>
            </form>
        </section>
        <section id="adminSection" class="card">
            <h2>جدار الحماية - تسجيل دخول المالك</h2>
            <form id="loginForm" onsubmit="handleAdminLogin(event)">
                <div class="form-group"><label>البريد الإلكتروني:</label><input type="email" id="adminEmail" class="form-control" placeholder="admin@abdelkader.com" required></div>
                <div class="form-group"><label>كلمة السر:</label><input type="password" id="adminPassword" class="form-control" required></div>
                <button type="submit" class="btn">تسجيل الدخول</button>
            </form>
        </section>
        <section id="adminPanel" class="card">
            <h2>لوحة إدارة المتجر</h2>
            <form onsubmit="addNewProduct(event)">
                <h3>إضافة منتج جديد:</h3>
                <div class="form-group"><label>اسم المنتج:</label><input type="text" id="newProdName" class="form-control" required></div>
                <div class="form-group"><label>الوصف:</label><input type="text" id="newProdDesc" class="form-control" required></div>
                <div class="form-group"><label>السعر:</label><input type="text" id="newProdPrice" class="form-control" required></div>
                <button type="submit" class="btn">إضافة المنتج</button>
            </form>
            <button onclick="logoutAdmin()" class="btn btn-danger" style="margin-top: 15px;">تسجيل الخروج</button>
        </section>
    </div>
    <footer><p>جميع الحقوق محفوظة &copy; abdelkader M.s.F</p></footer>
    <script>
        const ADMIN_EMAIL = "admin@abdelkader.com";
        const ADMIN_PASS = "kader2026";
        const defaultProducts = [
            { id: 1, name: "جهاز عرض (DataShow)", desc: "جودة عالية ودقة عرض ممتازة.", price: "25,000 دج" },
            { id: 2, name: "خدمة برمجة موقع", desc: "تصميم وتطوير مواقع حسب الطلب.", price: "10,000 دج" }
        ];
        function getProducts() {
            const saved = localStorage.getItem('store_products');
            return saved ? JSON.parse(saved) : defaultProducts;
        }
        function renderProducts() {
            const products = getProducts();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `<div class="product-item"><h3>${p.name}</h3><p>${p.desc}</p><div class="product-price">${p.price}</div><button class="btn" onclick="alert('تمت إضافة المنتج للسلة!')">أضف للسلة</button></div>`;
            });
        }
        function handleAdminLogin(e) {
            e.preventDefault();
            if(document.getElementById('adminEmail').value === ADMIN_EMAIL && document.getElementById('adminPassword').value === ADMIN_PASS) {
                alert('مرحباً بك يا عبد القادر في لوحة التحكم!');
                document.getElementById('adminSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else { alert('خطأ في البريد أو كلمة السر!'); }
        }
        function addNewProduct(e) {
            e.preventDefault();
            const products = getProducts();
            products.push({ id: Date.now(), name: document.getElementById('newProdName').value, desc: document.getElementById('newProdDesc').value, price: document.getElementById('newProdPrice').value });
            localStorage.setItem('store_products', JSON.stringify(products));
            renderProducts(); alert('تمت إضافة المنتج بنجاح!'); e.target.reset();
        }
        function logoutAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
        }
        window.onload = renderProducts;
    </script>
</body>
</html>
