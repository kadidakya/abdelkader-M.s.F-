<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Tahoma, sans-serif;
            background: #090d16;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 420px;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid #334155;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 20px;
            color: #38bdf8;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #1d4ed8;
        }
        #result {
            margin-top: 15px;
            font-size: 14px;
        }
        .download-btn {
            display: block;
            margin-top: 12px;
            padding: 14px;
            background: #22c55e;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .download-btn:hover {
            background: #16a34a;
        }
        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>تحميل الفيديوهات بدون علامة مائية</h2>
        <p>ألصق رابط الفيديو أدناه وسيظهر لك زر التحميل المباشر</p>
        
        <input type="text" id="urlInput" placeholder="أدخل الرابط هنا...">
        <button onclick="fetchVideo()">معالجة الفيديو 🚀</button>
        <div id="result"></div>
    </div>

    <footer>
        جميع الحقوق محفوظة m.s.f
    </footer>

    <script>
        async function fetchVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                alert('الرجاء إدخال الرابط أولاً!');
                return;
            }
            
            resultDiv.innerHTML = '<span style="color: #38bdf8;">جاري جلب الفيديو بدون علامة مائية... ⏳</span>';
            
            try {
                const response = await fetch(`https://tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                
                if (data.code === 0 && data.data && data.data.play) {
                    const videoUrl = data.data.play;
                    resultDiv.innerHTML = `
                        <p style="color: #22c55e; margin: 10px 0 5px 0; font-size:13px;">تم المعالجة بنجاح!</p>
                        <a class="download-btn" href="${videoUrl}" target="_blank">حفظ الفيديو (اضغط مطولاً أو حمل) 📥</a>
                    `;
                } else {
                    resultDiv.innerHTML = '<span style="color: #ef4444;">فشل في جلب الفيديو، تأكد من صحة الرابط.</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<span style="color: #ef4444;">حدث خطأ في الاتصال، حاول مجدداً.</span>';
            }
        }
    </script>

</body>
</html>
